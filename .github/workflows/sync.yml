name: Sync to HF
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Push to hub
        run: git push --force https://echo8900:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/echo8900/claw main
