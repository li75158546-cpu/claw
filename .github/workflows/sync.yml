name: Sync to HF
on:
  push:
    branches: [main]
  workflow_dispatch: # 允许你手动点击运行

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 强制同步：不管目标仓库有什么，直接用现在的覆盖
          git remote add hf https://echo8900:$HF_TOKEN@huggingface.co/spaces/echo8900/claw
          git push --force hf main
